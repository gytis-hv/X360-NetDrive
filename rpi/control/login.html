<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - X360-NetDrive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>X360-NetDrive</h1>
  <form method="post" action="/login" aria-labelledby="sign-in">
    <h2 id="sign-in">Sign in</h2>
    {{if .Error}}<p id="login-error" class="error" role="alert" tabindex="-1" autofocus>{{.Error}}</p>{{end}}
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="username">Username (required)</label>
    <input type="text" id="username" name="username" value="admin" required maxlength="80"
      autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next">
    <label for="password">Admin token (required)</label>
    <input type="password" id="password" name="password" required maxlength="128"
      autocomplete="current-password" aria-describedby="token-help" enterkeyhint="done">
    <button type="submit">Sign in</button>
    <p id="token-help">Use the token from x360-admin-token.txt on the Pi's bootfs.
      You can paste it or use your password manager. It is not your Linux password.</p>
  </form>
  <p>Use only on a trusted LAN or behind HTTPS. Plain HTTP does not encrypt your sign-in details.</p>
</main>
</body>
</html>
